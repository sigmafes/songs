<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCPE 0.6.1</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function () { resizeCanvas() }
  };

  function resizeCanvas() {
    const canvas = Module.canvas;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);

  function syncPersistentStorage() {
    if (typeof FS === 'undefined') return;
    FS.syncfs(false, function (err) {
      if (err) console.error('Sync FS failed: ' + err);
    });
  }

  function unlockAudio() {
    if (Module.webAudioContext && Module.webAudioContext.state === 'suspended') {
      Module.webAudioContext.resume();
    }
  }

  setInterval(syncPersistentStorage, 1000);
  window.addEventListener('pagehide', syncPersistentStorage);
  window.addEventListener('pointerdown', unlockAudio, { once: true });
  window.addEventListener('keydown', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') syncPersistentStorage();
  });
</script>

<script src="MinecraftPE.js"></script>
</body>
</html>
